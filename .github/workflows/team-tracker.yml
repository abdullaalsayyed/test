name: Team Metrics Tracker

on:
  schedule:
    # Run every Monday at 9 AM UTC (weekly report)
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger
    inputs:
      days:
        description: 'Number of days to track'
        required: false
        default: '7'

jobs:
  track-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run team tracker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          # Add your team members here (comma-separated GitHub usernames)
          TEAM_MEMBERS: user1,user2,user3,user4,user5
          TRACKING_DAYS: ${{ github.event.inputs.days || '7' }}
          REPORT_FORMAT: html
        run: npm run track

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: team-metrics-report
          path: reports/*.html
          retention-days: 90

      - name: Upload JSON report
        uses: actions/upload-artifact@v4
        with:
          name: team-metrics-json
          path: reports/*.json
          retention-days: 90

